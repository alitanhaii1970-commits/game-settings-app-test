name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned .app (no Apple Developer account needed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild \
            -project PCMax.xcodeproj \
            -scheme PCMax \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean build

      - name: Package unsigned .ipa (Payload structure for AltStore / Sideloadly)
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/PCMax.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "PCMax-ios-${{ github.run_number }}.ipa" Payload
          mkdir -p ../out
          cp "PCMax-ios-${{ github.run_number }}.ipa" ../out/

      - name: Upload IPA as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcmax-ios-ipa
          path: out/PCMax-ios-${{ github.run_number }}.ipa

      - name: Publish IPA to the same release page as the Android build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "v1.0.${{ github.run_number }}"
          files: out/PCMax-ios-${{ github.run_number }}.ipa
          body: "Latest Android + iOS builds, built automatically by GitHub Actions on every push to main."
          append_body: false
