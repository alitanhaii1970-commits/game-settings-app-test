name: UI check (emulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build debug APK and run Android Lint
        run: |
          mkdir -p ci-shots
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          code=$?
          grep -E '^w: ' build.log > ci-shots/kotlin-warnings.txt
          if [ $code -ne 0 ]; then tail -80 build.log > ci-shots/build-error.txt; exit $code; fi
          gradle lintDebug --stacktrace > lint.log 2>&1
          python3 .github/ci/lint_report.py
          exit 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ci/emulator_run.sh

      - name: Publish results to branch ci-shots
        if: always()
        run: |
          mkdir -p ci-shots && cd ci-shots
          for f in *.png; do [ -f "$f" ] && convert "$f" -resize 540x "$f" || true; done
          git init -q -b ci-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "UI check results" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots
