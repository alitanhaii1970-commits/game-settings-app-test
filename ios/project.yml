name: PCMax
options:
  bundleIdPrefix: com.gamesettings
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PCMax:
    type: application
    platform: iOS
    sources:
      - path: PCMax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamesettings.app.test
        PRODUCT_NAME: PCMax
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Config/Info.plist
